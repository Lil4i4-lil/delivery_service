[project]
name = "delivery-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Misha Fomin", email = "mihanaz098@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "adrf>=0.1.14",
    "apiclient>=1.0.4",
    "celery>=5.7.0",
    "celery-types>=0.26.0",
    "chromadb>=1.5.9",
    "django==6.0.10",
    "django-allauth>=65.22.1",
    "django-celery-beat==2.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-rest-framework>=0.1.0",
    "django-timezone-field>=5.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser>=2.3.5",
    "drf-spectacular>=0.30.0",
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "openai>=3.57.0",
    "packaging>=26.3",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
delivery-service = "delivery_service:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
]
