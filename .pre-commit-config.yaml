repos:
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make
        language: system
        pass_filenames: false
        args: ["check"]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        args: [ "-q", "--no-header" ]
        stages: [ pre-push ]

      # Быстрая проверка: валиден ли docker-compose.yml
      - id: docker-compose-config
        name: docker compose config
        entry: docker compose config --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Полная сборка: только перед push
      - id: docker-compose-build
        name: docker compose build
        entry: docker compose build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]